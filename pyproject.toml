[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "envdoctor"
version = "0.1.0"
description = "Answer 'can this AI project run on my machine?' with evidence: scan, probe, analyze, and verify in a throwaway environment"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "envdoctor contributors" }]
keywords = [
    "environment",
    "cuda",
    "pytorch",
    "gpu",
    "diagnostics",
    "reproducibility",
    "windows",
    "developer-tools",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: System :: Systems Administration",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
    "typer>=0.12",
    "pydantic>=2.7",
    "rich>=13.7",
    "packaging>=24.0",
    "psutil>=5.9",
    "jinja2>=3.1",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "nvidia-ml-py>=12.535; sys_platform != 'darwin'",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "pyright>=1.1.350",
]

[project.scripts]
envdoctor = "envdoctor.cli.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/envdoctor"]

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/tests",
    "/docs",
    "/scripts",
    "/README.md",
    "/DEVELOPMENT.md",
    "/LICENSE",
    "/CHANGELOG.md",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --color=no"
pythonpath = ["src", "tests"]
markers = [
    "network: needs network access (real uv venv + index install); skipped unless the machine can reach the index",
    "gpu: requires a real NVIDIA GPU and driver (skipped by default)",
    "slow: takes more than a few seconds",
]

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "C4", "RUF"]
ignore = [
    "RUF001",  # full-width punctuation is intentional in Chinese user-facing strings
    "RUF002",
    "RUF003",
    "B008",    # typer.Option()/Argument() in defaults is the framework's own idiom
    "UP042",   # `(str, Enum)` is deliberate: pydantic v2 + JSON rendering rely on .value
    "SIM105",  # try/except/pass is clearer than contextlib.suppress at the NVML cleanup call sites
]

[tool.ruff.lint.isort]
known-first-party = ["envdoctor"]

[tool.pyright]
include = ["src"]
venvPath = "."
venv = ".venv"
pythonVersion = "3.11"
typeCheckingMode = "standard"
reportUnusedExpression = false
