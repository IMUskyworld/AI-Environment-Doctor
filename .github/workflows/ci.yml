name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: windows / py${{ matrix.python }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python }}
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen --extra dev --python ${{ matrix.python }}

      - name: Lint (ruff)
        run: uv run ruff check src tests scripts

      - name: Format check (ruff)
        run: uv run ruff format --check src tests scripts

      - name: Types (pyright, library code only)
        run: uv run pyright

      - name: Schemas are current
        run: uv run python scripts/export_schemas.py --check

      - name: Tests (no gpu)
        run: uv run pytest -q -m "not gpu"

      # The MVP contract: every §22 criterion has executable evidence.
      - name: MVP audit (DEVELOPMENT.md 22)
        run: uv run python scripts/verify_mvp.py --skip-tests

      - name: Performance overhead (non-blocking)
        continue-on-error: true
        run: uv run python scripts/bench_overhead.py

  package:
    name: build & install (wheel smoke test)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.11"

      - name: Build distributions
        run: uv build --out-dir dist

      - name: Install the built wheel into a clean environment
        run: |
          uv venv .venv-wheel --python 3.11
          uv pip install --python .venv-wheel/Scripts/python.exe dist/*.whl

      - name: Console script works
        run: .venv-wheel/Scripts/envdoctor.exe version

      - name: Module entry point works
        run: .venv-wheel/Scripts/python.exe -m envdoctor version

      - name: Web console serves its page and enforces the token
        run: |
          .venv-wheel/Scripts/envdoctor.exe web --port 8799 --no-open --workdir .envdoctor-web > web.log 2>&1 &
          for i in $(seq 1 30); do
            if grep -q "token=" web.log; then break; fi
            sleep 0.5
          done
          token=$(grep -o "token=[A-Za-z0-9_-]*" web.log | head -n 1 | cut -d= -f2)
          test -n "$token"
          # 无令牌 → 403；有令牌 → 200 且页面内嵌令牌
          status=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:8799/)
          test "$status" = "403"
          curl -s "http://127.0.0.1:8799/?token=$token" | grep -q "envdoctor-token"
          # 非回环 Host 头 → 403（DNS rebinding 防护）
          status=$(curl -s -o /dev/null -w "%{http_code}" -H "Host: evil.example.com" \
            -H "X-Envdoctor-Token: $token" http://127.0.0.1:8799/api/machine)
          test "$status" = "403"

      - name: Self-contained HTML report
        run: |
          .venv-wheel/Scripts/envdoctor.exe doctor . --no-verify --workdir .envdoctor-work >$null
          report=$(ls -1 .envdoctor-work/runs/*/report.html | head -n 1)
          test -f "$report"
          ! grep -E '(src|href)="https?://' "$report"

  gpu:
    name: GPU checks (manual, real hardware)
    runs-on: [self-hosted, windows, NVIDIA]
    needs: quality
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.11"
      - run: uv sync --frozen --extra dev
      - run: uv run pytest -q -m gpu
