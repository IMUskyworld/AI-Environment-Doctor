name: 功能建议
description: 提出新能力或改进方向
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 你现在怎么做、卡在哪里
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 期望 envdoctor 怎么帮你
      description: 具体的命令、输出或判定形态
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 现有替代方案
      description: 你试过什么、为什么不够
